name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/ClipX/ClipX.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/ClipX

      - name: Trim LibVLC to win-x64
        # The VideoLAN package ships win-x64, win-x86 and win-arm64 plugin sets
        # (~400MB total); the release only needs win-x64.
        run: |
          Remove-Item -Recurse publish/ClipX/libvlc/win-x86
          Remove-Item -Recurse publish/ClipX/libvlc/win-arm64

      - name: Bundle FFmpeg
        # Pinned to a reproducible BtbN autobuild (GPL build; see THIRD_PARTY_NOTICES.md).
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-27-12-42/ffmpeg-n8.1.3-41-ga8029b6528-win64-gpl-8.1.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip
          New-Item -ItemType Directory publish/ClipX/tools
          Copy-Item ffmpeg-*/bin/ffmpeg.exe publish/ClipX/tools/
          Copy-Item ffmpeg-*/bin/ffprobe.exe publish/ClipX/tools/

      - name: Zip
        run: Compress-Archive -Path publish/ClipX -DestinationPath "ClipX-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClipX-*.zip
