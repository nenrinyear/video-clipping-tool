name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/ClipX/ClipX.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/ClipX

      - name: Trim LibVLC to win-x64
        # The VideoLAN package ships win-x64, win-x86 and win-arm64 plugin sets
        # (~400MB total); the release only needs win-x64.
        run: |
          Remove-Item -Recurse publish/ClipX/libvlc/win-x86
          Remove-Item -Recurse publish/ClipX/libvlc/win-arm64

      - name: Bundle FFmpeg
        # Pinned to a reproducible BtbN autobuild (GPL build; see THIRD_PARTY_NOTICES.md).
        run: |
          curl.exe -fL --retry 3 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-27-12-42/ffmpeg-n8.1.3-41-ga8029b6528-win64-gpl-8.1.zip"
          $size = (Get-Item ffmpeg.zip).Length
          if ($size -lt 50MB) { throw "ffmpeg.zip download failed: only $($size) bytes" }
          # tar (bsdtar) extracts the archive's own entry names; Expand-Archive
          # on current runner images misnames the top-level folder.
          tar -xf ffmpeg.zip
          if (-not (Test-Path 'ffmpeg-*/bin/ffmpeg.exe')) {
            Get-ChildItem -Force | Format-Table Name, Length
            throw 'FFmpeg build folder not found after extraction'
          }
          New-Item -ItemType Directory publish/ClipX/tools
          Copy-Item ffmpeg-*/bin/ffmpeg.exe publish/ClipX/tools/
          Copy-Item ffmpeg-*/bin/ffprobe.exe publish/ClipX/tools/
          # Keep the bundled build's license and copyright notices inside the zip.
          Copy-Item ffmpeg-*/LICENSE.txt publish/ClipX/tools/
          Get-ChildItem ffmpeg-*/COPYING* | ForEach-Object { Copy-Item $_.FullName publish/ClipX/tools/ }
          if (-not (Test-Path 'publish/ClipX/tools/ffmpeg.exe') -or -not (Test-Path 'publish/ClipX/tools/ffprobe.exe')) {
            throw 'FFmpeg bundle verification failed: tools/ is missing ffmpeg.exe or ffprobe.exe'
          }
          Get-ChildItem publish/ClipX/tools

      - name: Zip
        run: Compress-Archive -Path publish/ClipX -DestinationPath "ClipX-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClipX-*.zip
