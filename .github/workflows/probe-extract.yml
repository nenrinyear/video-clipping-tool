name: probe-extract

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe extraction behavior
        run: |
          $PSVersionTable | Format-List
          curl.exe -fsL --retry 3 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-27-12-42/ffmpeg-n8.1.3-41-ga8029b6528-win64-gpl-8.1.zip"
          Write-Host '--- zip size:'; (Get-Item ffmpeg.zip).Length
          Write-Host '--- first 5 zip entries (from .NET):'
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path ffmpeg.zip))
          $zip.Entries | Select-Object -First 5 | ForEach-Object { $_.FullName }
          $zip.Dispose()
          Write-Host '--- Expand-Archive:'
          Expand-Archive ffmpeg.zip
          Write-Host '--- directories after Expand-Archive:'
          Get-ChildItem -Directory | ForEach-Object { $_.Name }
          Write-Host '--- tar alternative:'
          mkdir tarout
          tar -xf ffmpeg.zip -C tarout
          Get-ChildItem tarout -Directory | ForEach-Object { $_.Name }
